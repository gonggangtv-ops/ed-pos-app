<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>จอคนเสิร์ฟ</title>
<!-- จอคนเสิร์ฟ (test-1.81) · แท็บเล็ตตั้งที่จุดรับอาหาร ไม่ต้องใส่รหัส (เหมือนจอครัว)
     ครัวกดเสร็จ → ขึ้นว่าจานไหนไปโต๊ะไหน · แตะ = เสิร์ฟแล้ว · เมนูที่ตั้ง "เตรียมให้ครัว" สั่งเข้ามา → ขึ้นแถบให้เตรียมของ
     API: GET /api/serve · POST /api/serve/done {ids,undo} · POST /api/serve/prep {ids,undo}
     ค่าตั้งของเครื่องนี้: localStorage serve_cfg (รูปแบบ ขนาด หมวดที่ไม่ขึ้น เสียง ฯลฯ) -->
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  [hidden]{display:none!important}
  :root{--pz:1;--nz:1;--oz:1;--dn:1;--rad:18px;--bw:1px;--fw:700;--prepc:#ff9f1c;--bg:#0f1318;--card:#1a2029;--card2:#232a35;--line:#2b3340;--text:#f1f4f8;--muted:#a3adba;--opt:#ffd43b;--acc:#2fd07a;--ink:#06210f;--rmk:#d6336c;
    --amber:#ff9f1c;--amber2:#3b2a12;--z:1;--gap:14px;--shadow:0 6px 20px #0006}
  body{font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;
    font-variant-numeric:tabular-nums;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:inherit;cursor:pointer}
  #app{height:100%;display:flex;flex-direction:column}
  header{flex:none;min-height:64px;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 12px #0003;position:relative;z-index:2}
  .brand{font-size:21px;font-weight:700;margin-right:6px;display:flex;align-items:center;gap:9px}
  .logo{width:36px;height:36px;border-radius:11px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#2fd07a;box-shadow:0 0 0 3px #2fd07a33}.dot.off{background:#ff5a52;box-shadow:0 0 0 3px #ff5a5233}
  .tab{height:46px;padding:0 18px;border-radius:23px;border:0;background:var(--card2);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background .2s,transform .15s}
  .tab:active{transform:scale(.96)}
  .tab.on{background:var(--acc);color:var(--ink);font-weight:700}
  .tab .n{min-width:28px;padding:0 8px;border-radius:14px;background:#0007;color:#fff;font-size:15px;font-weight:700;text-align:center}
  .sp{flex:1}
  .ibtn{height:46px;min-width:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line);background:var(--card2);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  #clock{font-size:24px;font-weight:700;letter-spacing:.5px}
  #main{flex:1;min-height:0;display:flex;gap:var(--gap);padding:var(--gap)}
  #main.ptop{flex-direction:column}
  #board{flex:1;min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:2px}
  .grid{display:grid;gap:var(--gap);align-items:start;align-content:start}
  .empty{text-align:center;color:var(--muted);padding:90px 20px;font-size:calc(21px*var(--z))}
  .empty .ic{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--acc)}
  .empty b{display:block;font-size:calc(34px*var(--z));margin-bottom:6px;color:var(--text)}
  /* เวลา + ป้าย */
  .tm{flex:none;font-size:calc(15px*var(--z));font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap}
  .tm.fresh{color:#06210f;background:#63e6be}.tm.warn{color:#1a1000;background:#ffb347}.tm.late{color:#fff;background:#e03131}
  .tag{font-size:calc(13px*var(--z));font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .tag.ta{background:#ffd43b;color:#151a21}.tag.th{background:#a5d8ff;color:#0f1318}
  .op{font-size:calc(15px*var(--z)*var(--oz));color:var(--opt);font-weight:500}
  /* test-1.92 ตัวเลือก: ชิป · ขนาดไฮไลต์ · ไอคอน */
  .op.ochips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .oc{display:inline-flex;align-items:center;gap:4px;line-height:1.3}
  .op.ochips .oc{padding:1px 9px;border-radius:20px;background:var(--card2);color:var(--opt)}
  .op.ol .dot2{font-style:normal;margin:0 5px;opacity:.6}
  .oc.sz{background:var(--c)!important;color:#111!important;font-weight:800;padding:1px 9px;border-radius:20px}
  .oc.sz.lg{font-size:1.2em;padding:2px 12px}
  .oe{font-size:1.15em}
  .oi{width:1.7em;height:1.7em;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:1em}
  .op.ochips .oc .oi{margin-left:-7px}
  .eo .oe,.eo .oi{font-size:1.5em}
  .qn{flex:none;min-width:calc(40px*var(--z));font-size:calc(26px*var(--z));font-weight:800;color:var(--acc)}
  .tbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:0 calc(14px*var(--z)) 4px}
  .tbar i{display:block;height:100%;background:var(--st,#63e6be);border-radius:3px}
  .tms{font-size:calc(14px*var(--z));color:var(--muted);font-weight:600;white-space:nowrap}
  .rk{align-self:flex-start;margin-top:4px;font-size:calc(13px*var(--z));font-weight:700;color:#fff;background:var(--rmk);border-radius:20px;padding:1px 9px}
  .qc{flex:none;width:calc(36px*var(--z));height:calc(36px*var(--z));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(18px*var(--z));font-weight:700;border:2px solid var(--muted)}
  .qc.many{background:var(--text);color:var(--bg);border-color:var(--text)}
  /* การ์ดตามโต๊ะ */
  .card{position:relative;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
  .card::before{content:"";height:5px;background:var(--st,#63e6be)}
  .card.s-warn{--st:#ffb347}.card.s-late{--st:#e03131;border-color:#e03131}
  .ch{display:flex;align-items:center;gap:8px;padding:calc(10px*var(--z)*var(--dn)) calc(14px*var(--z)) calc(6px*var(--z)*var(--dn))}
  .tl{font-size:calc(30px*var(--z));font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rows{padding:0 calc(8px*var(--z)) 4px}
  .dr{width:100%;display:flex;align-items:center;gap:12px;padding:calc(9px*var(--z)*var(--dn)) 6px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;min-height:56px;border-radius:10px;transition:background .15s}
  .dr:active{background:var(--card2)}
  .dr .dm{flex:1;min-width:0;display:flex;flex-direction:column}
  .dr .nm{font-size:calc(20px*var(--z)*var(--nz));font-weight:var(--fw);line-height:1.25}
  .go{flex:none;height:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line);background:var(--card2);font-size:calc(15px*var(--z));font-weight:700;display:flex;align-items:center;gap:6px}
  .cf{padding:calc(8px*var(--z)) calc(10px*var(--z)) calc(10px*var(--z));margin-top:auto}
  .all{width:100%;min-height:calc(56px*var(--z));border-radius:14px;border:0;background:var(--acc);color:var(--ink);font-size:calc(18px*var(--z));font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
  .all:active{transform:scale(.98);filter:brightness(1.1)}
  /* ทีละจาน */
  .tile{position:relative;min-height:calc(160px*var(--z)*var(--dn));border-radius:var(--rad);border:var(--bw) solid var(--line);background:var(--card);padding:calc(14px*var(--z));display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--shadow);overflow:hidden}
  .tile::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--st,#63e6be)}
  .tile.s-warn{--st:#ffb347}.tile.s-late{--st:#e03131;border-color:#e03131}
  .tile .tt{display:flex;align-items:center;gap:8px}
  .tile .tb{font-size:calc(34px*var(--z));font-weight:700;line-height:1}
  .tile .nm{font-size:calc(25px*var(--z)*var(--nz));font-weight:var(--fw);line-height:1.2}
  .tile .hint{margin-top:auto;font-size:calc(13px*var(--z));color:var(--muted);display:flex;align-items:center;gap:6px}
  .tb small{font-size:.5em;font-weight:600;color:var(--muted)}
  /* รายการแถว */
  .lr{width:100%;display:grid;grid-template-columns:auto calc(120px*var(--z)) minmax(0,1fr) auto;align-items:center;gap:14px;padding:calc(10px*var(--z)*var(--dn)) 16px;border:var(--bw) solid var(--line);border-radius:var(--rad);background:var(--card);text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
  .lr.s-late{border-color:#e03131}
  .lr .tb{font-size:calc(26px*var(--z));font-weight:700}
  .lr .nm{font-size:calc(21px*var(--z)*var(--nz));font-weight:var(--fw)}
  .lr .go{background:var(--acc);color:var(--ink);border:0}
  /* เตรียมให้ครัว */
  #prep{flex:none;display:flex;flex-direction:column;gap:10px;min-height:0}
  #main.pside #prep,#main.pright #prep{width:calc(310px*var(--pz));max-width:45%;overflow-y:auto}
  #main.pright #prep{order:2}
  #main.ptop #prep{flex-direction:row;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
  .ph{font-size:calc(15px*var(--pz));font-weight:700;color:var(--amber);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;white-space:nowrap;padding:0 4px}
  #main.pside .ph,#main.pright .ph{flex-direction:row;justify-content:flex-start}
  .ph .ic{width:42px;height:42px;border-radius:50%;background:var(--amber2);display:flex;align-items:center;justify-content:center;font-size:22px}
  .pc{position:relative;flex:none;min-width:calc(270px*var(--pz));max-width:calc(380px*var(--pz));border-radius:var(--rad);background:var(--amber2);border:2px solid var(--prepc);padding:calc(12px*var(--pz)) 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
  .pc .what{display:flex;align-items:center;gap:8px;font-size:calc(22px*var(--pz));font-weight:700;line-height:1.2}
  .pc .what .tx{flex:1;min-width:0}
  .pc .pq{flex:none;font-size:calc(20px*var(--pz));background:var(--prepc);color:#1a1000;border-radius:20px;padding:1px 12px;font-weight:700}
  .pc .th{font-size:.62em;background:#a5d8ff;color:#0f1318;border-radius:20px;padding:1px 9px;vertical-align:middle;margin-left:4px}
  .pc .szs{display:flex;flex-wrap:wrap;gap:6px}
  .pc .sz{font-size:calc(16px*var(--pz));font-weight:700;border-radius:20px;padding:2px 11px;background:#0003;border:1px solid var(--amber)}
  body.light .pc .sz{background:#fff}
  .pc .pl{display:flex;flex-direction:column;gap:4px}
  .pc .pr{margin:0;min-height:44px;display:flex;align-items:center;gap:10px;padding:4px 10px;border-radius:12px;border:0;background:#0003;color:inherit;font-size:calc(16px*var(--pz));text-align:left;transition:background .15s}
  body.light .pc .pr{background:#fff}
  .pc .pr b{flex:none}.pc .pr span{flex:1;min-width:0}.pc .pr small{opacity:.8;flex:none}
  .pc .for{font-size:calc(14px*var(--pz));opacity:.9}
  .pc > button{margin-top:2px;min-height:48px;border-radius:calc(var(--rad) - 4px);border:0;background:var(--prepc);color:#1a1000;font-size:calc(17px*var(--pz));font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  /* เสิร์ฟแล้ว */
  .svbox{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
  .sv{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:calc(17px*var(--z))}
  .sv:last-child{border-bottom:0}
  .sv .w{flex:1;min-width:0}
  .sv button{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-weight:700}
  /* แจ้งเตือน */
  #toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:30px;background:#000e;color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 30px #0008}
  .toast button{height:40px;padding:0 16px;border-radius:20px;border:0;background:#fff;color:#111;font-weight:700}
  /* ตั้งค่า */
  #set{position:fixed;inset:0;z-index:50;background:#000a;display:flex;justify-content:flex-end}
  #set .pan{width:min(540px,100%);height:100%;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);padding:18px 20px 40px}
  #set h2{margin:0 0 6px;font-size:23px}
  #set h3{margin:22px 0 8px;font-size:16px;color:var(--muted)}
  #set p.s{margin:6px 0 0;font-size:13px;color:var(--muted)}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-size:15px;font-weight:600}
  .seg button.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
  .chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:transparent;font-size:15px;font-weight:700}
  .chip.off{opacity:.55;text-decoration:line-through}
  .stabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;position:sticky;top:-18px;background:var(--card);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
  .stabs button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:15px}
  .stabs button.on{background:var(--text);color:var(--bg)}
  .thm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .thm button{min-height:64px;border-radius:14px;border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-weight:700;font-size:14px}
  .thm button.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
  .thm .sw3{display:flex;gap:4px}.thm .sw3 i{width:18px;height:18px;border-radius:50%;border:1px solid #0003}
  .sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sws button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}
  .sws button.on{border-color:var(--text)}
  .sws input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:2px}
  .icg{margin:10px 0 2px;font-size:13px;color:var(--muted);font-weight:700}
  .icr{display:flex;align-items:center;gap:8px;padding:4px 0}
  .icr .nmx{flex:1;min-width:0;font-weight:600}
  .icr button.icb{width:46px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:22px}
  .icr button.icb.sel{border-color:var(--acc)}
  .icr input{width:90px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;text-align:center}
  .icr input[type=color]{width:56px;padding:2px}
  .pal{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:46px;background:var(--card);padding:6px 0;z-index:1}
  .pal button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:22px}
  .prev{border:1px dashed var(--line);border-radius:14px;padding:10px;margin-top:8px}.chip.pmoff{opacity:.65}
  .chip.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
  /* ===== แอนิเมชัน (test-1.85) · ปิดได้ใน ⚙ หรือเมื่อเครื่องตั้งลดการเคลื่อนไหว ===== */
  @keyframes popIn{0%{opacity:0;transform:translateY(16px) scale(.94)}70%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{transform:none}}
  @keyframes rowIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(40px) scale(.96)}}
  @keyframes cardOut{to{opacity:0;transform:scale(.9) translateY(-8px)}}
  @keyframes glow{0%,100%{box-shadow:var(--shadow),0 0 0 0 #ff9f1c00}50%{box-shadow:var(--shadow),0 0 0 8px #ff9f1c55}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes latePulse{0%,100%{box-shadow:var(--shadow),0 0 0 0 #e0313100}50%{box-shadow:var(--shadow),0 0 0 6px #e0313155}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes setIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  body.anim .enter{animation:popIn .5s cubic-bezier(.2,.8,.2,1) both}
  body.anim .rin{animation:rowIn .4s ease-out both}
  body.anim .out{animation:out .24s ease-in forwards;pointer-events:none}
  body.anim .card.cout{animation:cardOut .26s ease-in forwards;pointer-events:none}
  body.anim .pc.hot{animation:glow 1.1s ease-in-out 3}
  body.anim .pc.hot .ic2{animation:wobble .5s ease-in-out 3}
  body.anim .bump{animation:bump .45s ease-out}
  body.anim .s-late{animation:latePulse 1.6s ease-in-out infinite}
  body.anim .empty .ic{animation:floatY 3s ease-in-out infinite}
  body.anim .toast{animation:toastIn .25s ease-out}
  body.anim #set:not([hidden]) .pan{animation:setIn .25s ease-out}
  @media (prefers-reduced-motion:reduce){body.anim *{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand"><span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8V6"/><path d="M10 6h4"/></svg></span>คนเสิร์ฟ<span class="dot" id="dot" title="การเชื่อมต่อ"></span></span>
    <button class="tab on" data-view="ready">รอเสิร์ฟ <span class="n" id="nReady">0</span></button>
    <button class="tab" data-view="served">เสิร์ฟแล้ว</button>
    <a class="tab" href="kds.html" style="text-decoration:none;color:inherit">🍳 จอครัว</a>
    <span class="sp"></span>
    <span id="info" class="muted" style="font-size:14px;color:var(--muted)"></span>
    <button class="ibtn" id="sndBtn" aria-label="เปิด/ปิดเสียง"></button>
    <button class="ibtn" id="setBtn">⚙ ปรับแต่ง</button>
    <span id="clock"></span>
  </header>
  <div id="main">
    <aside id="prep" aria-label="เตรียมให้ครัว"></aside>
    <section id="board" aria-live="polite"></section>
  </div>
</div>
<div id="toasts"></div>
<div id="set" hidden><div class="pan" id="setPan" role="dialog" aria-label="ปรับแต่งจอคนเสิร์ฟ"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let busy=false;

  if(!j.ok)throw new Error(j.error||'');
  $('#dot').classList.remove('off');$('#info').textContent='';
  const fresh=j.ready.filter(d=>!seenR.has(d.id)&&!C.hide.includes(d.cat)),freshP=j.prep.filter(p=>!seenP.has(p.id));
  j.ready.forEach(d=>seenR.add(d.id));j.prep.forEach(p=>seenP.add(p.id));
  const live=new Set([...j.ready.map(d=>d.id),...j.served.map(d=>d.id)]);for(const id of gone)if(!live.has(id))gone.delete(id);
  for(const d of j.ready)if(gone.has(d.id)&&!d.servedAt)gone.delete(d.id);

  primed=true;render();

busy=false;}

async function serve(ids,label){ids=ids.filter(Boolean);if(!ids.length)return;ids.forEach(id=>gone.add(id));render();

  toast('เสิร์ฟแล้ว · '+label,'↩ ยกเลิก',async()=>{ids.forEach(id=>gone.delete(id));await post('/api/serve/done',{ids,undo:true});poll();});poll();}

  const sizeLine=items=>{const z=new Map();for(const x of items){const k=x.size||'';z.set(k,(z.get(k)||0)+(+x.qty||1));}
    const e=[...z].filter(([k])=>k);return e.length?`<div class="szs">${[...z].map(([k,q])=>`<span class="sz">${esc(k||'ไม่ระบุขนาด')} ${q}</span>`).join('')}</div>`:'';};
  // หัวการ์ดบอกแล้วว่าเตรียมอะไร (ข้าวราด หรือชื่อเมนู) → แถวบอกแค่ขนาด × จำนวน
  // test-1.88 ไม่บอกโต๊ะ → แถวรวมตามขนาด (แตะ = เตรียมขนาดนั้นครบ)
  const sizeRows=g=>{const z=new Map();for(const x of g.items){const k=x.size||'';if(!z.has(k))z.set(k,{k,q:0,ids:[],at:x.at});const r=z.get(k);r.q+=(+x.qty||1);r.ids.push(x.id);r.at=Math.min(r.at,x.at);}return [...z.values()];};
  const rowTxt=x=>`${x.size?esc(x.size):''}${x.qty>1?(x.size?' ':'')+'×'+esc(x.qty):x.size?'':'1 จาน'}`;
  if(C.prepGroup!==false){
    const g0=new Map();for(const x of list){const t=prepTitle(x),k=t+(x.thai?'|th':'');if(!g0.has(k))g0.set(k,{k,t,thai:x.thai,q:0,items:[]});const g=g0.get(k);g.q+=(+x.qty||1);g.items.push(x);}
    p.innerHTML=head+[...g0.values()].map(g=>{const hot=!firstPaint&&(PREV[g.k]||0)<g.q;PREV[g.k]=g.q;
      return `<div class="pc${hot?' hot':''}${fx('p'+g.k,'enter')}"><span class="what"><span class="tx">${esc(g.t)}${g.thai?'<span class="th">คนไทย</span>':''}</span><span class="pq${hot?' bump':''}">${g.q} จาน</span></span>
      <div class="pl">${sizeRows(g).map(r=>`<button class="pr${fx('pz'+g.k+r.k,'rin')}" data-prep="${esc(r.ids.join(','))}" data-label="${esc(g.t+' '+(r.k||'')+' '+r.q+' จาน')}">${r.k&&C.sizeHL!=='off'?`<span class="oc sz${C.sizeHL==='big'?' lg':''}" style="--c:${sizeColor(r.k)}">${esc(r.k)}</span>`:`<b>${esc(r.k||'ปกติ')}</b>`}<span></span><b>${r.q} จาน</b><small>${mins(r.at)} น.</small></button>`).join('')}</div>
      <button data-prep="${esc(g.items.map(x=>x.id).join(','))}" data-label="${esc(g.t+' '+g.q+' จาน')}">${CHECK}เตรียมครบ ${g.q} จาน</button></div>`;}).join('');
    for(const k of Object.keys(PREV))if(!g0.has(k))delete PREV[k];
    return;
  }
  p.innerHTML=head+list.map(x=>`<div class="pc${fx('p1'+x.id,'enter hot')}"><span class="what"><span class="tx">${esc(prepTitle(x))}${x.thai?'<span class="th">คนไทย</span>':''}</span><span class="pq">${esc(x.qty)} จาน</span></span>
    ${x.size?`<div class="szs"><span class="sz">${esc(x.size)}</span></div>`:''}${!x.label&&x.opts.length?`<span class="for" style="color:var(--opt)">${esc(x.opts.join(' · '))}</span>`:''}${x.remark?`<span class="rk">${esc(x.remark)}</span>`:''}
    <span class="for">สั่งมา ${mins(x.at)} นาที</span>
    <button data-prep="${esc(x.id)}" data-label="${esc(prepTitle(x))}">${CHECK}เตรียมแล้ว</button></div>`).join('');
}
let lastN=null;
function render(){
  document.documentElement.style.setProperty('--z',C.size);document.documentElement.style.setProperty('--pz',C.psize||1);applyLook();document.body.classList.toggle('anim',C.anim!==false);
  const n=shown().reduce((s,d)=>s+(+d.qty||1),0),nEl=$('#nReady');nEl.textContent=n;
  if(lastN!=null&&n>lastN){nEl.classList.remove('bump');void nEl.offsetWidth;nEl.classList.add('bump');}lastN=n;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===view));

function toast(msg,act,fn){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>`;
  if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{t.remove();fn();};t.appendChild(b);}
  const box=$('#toasts');box.appendChild(t);while(box.children.length>2)box.firstChild.remove();setTimeout(()=>t.remove(),6000);}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.serve||t.dataset.prep){const anim=C.anim!==false&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el=t.classList.contains('all')?t.closest('.card'):t.dataset.prep&&t.parentElement.classList.contains('pc')?t.parentElement:t;
    if(anim&&el)el.classList.add(el.classList.contains('card')?'cout':'out');
    const go=()=>t.dataset.serve?serve(t.dataset.serve.split(','),t.dataset.label||''):prepDone(t.dataset.prep.split(','),t.dataset.label||'');
    anim?setTimeout(go,230):go();return;}
  if(t.dataset.recall){post('/api/serve/done',{ids:[t.dataset.recall],undo:true}).then(poll);toast('เรียกกลับแล้ว');return;}
  if(t.dataset.view){view=t.dataset.view;render();return;}
  if(t.dataset.stab){STAB=t.dataset.stab;renderSet();$('#setPan').scrollTop=0;return;}
  if(t.dataset.ck!=null&&t.dataset.cv!=null){C[t.dataset.ck]=t.dataset.cv;saveC();render();renderSet();return;}
  if(t.dataset.icsel!=null){ICSEL=t.dataset.icsel;renderSet();return;}
  if(t.dataset.emo!=null){if(!ICSEL){toast('แตะช่องไอคอนของตัวเลือกก่อน');return;}C.icons={...C.icons,[ICSEL]:t.dataset.emo};saveC();render();renderSet();return;}
  if(t.id==='icReset'){C.icons={};saveC();render();renderSet();return;}
  if(t.dataset.k){let v=t.dataset.v;if(v==='true'||v==='false')v=v==='true';else if(['size','psize','warn','late','rad','bw','dens','nz','oz','fw'].includes(t.dataset.k))v=+v;
    C[t.dataset.k]=v;saveC();render();renderSet();return;}
  if(t.dataset.pm){const id=t.dataset.pm,k=t.dataset.adm==='1'?'prepOff':'prepIds';C[k]=C[k].includes(id)?C[k].filter(x=>x!==id):[...C[k],id];saveC();render();renderSet();return;}
  if(t.dataset.pmall){C.prepIds=[];C.prepOff=(D.menus||[]).filter(m=>m.prep).map(m=>m.id);saveC();render();renderSet();return;}
  if(t.dataset.hide!=null){const c=t.dataset.hide;C.hide=C.hide.includes(c)?C.hide.filter(x=>x!==c):[...C.hide,c];saveC();render();renderSet();return;}
  if(t.id==='setBtn'){renderSet();$('#set').hidden=false;return;}
  if(t.id==='setClose'){$('#set').hidden=true;return;}
  if(t.id==='sndBtn'){C.sound=!C.sound;saveC();render();if(C.sound)beep('ready');return;}
  if(t.id==='tryVoice'){const s=C.sound;C.sound=true;beep('ready');say(sentence({table:'5',name:'กะเพราหมู',qty:2}));C.sound=s;return;}
  if(t.id==='resetSet'){C=JSON.parse(JSON.stringify(DEF));saveC();render();renderSet();return;}
});
$('#set').addEventListener('click',e=>{if(e.target.id==='set')$('#set').hidden=true;});
// ช่องสี / ช่องพิมพ์อีโมจิ
$('#setPan').addEventListener('input',e=>{const t=e.target;
  if(t.dataset.cin){C[t.dataset.cin]=t.value;saveC();render();return;}
  if(t.dataset.szc){C.sizeColors={...C.sizeColors,[t.dataset.szc]:t.value};saveC();render();return;}
  if(t.dataset.icin!=null){const v=t.value.trim();const ic={...C.icons};if(v)ic[t.dataset.icin]=v;else delete ic[t.dataset.icin];C.icons=ic;saveC();render();
    const b=t.parentElement.querySelector('.icb');if(b)b.textContent=iconOf(t.dataset.icin)||'·';}});
$('#setPan').addEventListener('change',e=>{const t=e.target;if(t.dataset.cin||t.dataset.szc)renderSet();});
function clockTick(){$('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
render();poll();setInterval(poll,2000);clockTick();setInterval(()=>{clockTick();if(view==='ready')render();},20000);
</script>
