<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>จอครัว 2.0</title>
<link rel="manifest" href="manifest-kds.json">
<!-- จอครัว 2.0 (test-1.72) · หน้าใหม่แยกจาก kds.html · ใช้ API เดิม (/api/orders, /api/dish/complete, /api/order/complete)
     ค่าตั้งของหน้านี้อยู่ใน localStorage kds2_* · อ่านค่าเสียงของจอเดิม (kds_snd / kds_tts / kds_call / kds_nobatch) แบบอ่านอย่างเดียว ไม่เขียนทับ -->
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  [hidden]{display:none!important}
  body{font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:var(--bg,#0b0d10);color:var(--text,#f3f5f7);overflow:hidden;
    font-variant-numeric:tabular-nums;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:inherit}
  #app{height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
  /* แถบบาง (แสดงตลอด) + แถบเมนู (ซ่อนเมื่อไม่แตะ) */
  #strip{flex:none;height:42px;padding:0 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);font-size:15px}
  #strip .dot{width:9px;height:9px;border-radius:50%;background:#2fd07a}#strip .dot.off{background:#ff5a52}
  #strip .muted,.muted{color:var(--muted)}
  #strip .sp{flex:1}
  .sbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
  #bar{position:fixed;top:0;left:0;right:0;z-index:40;min-height:64px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 10px 30px #0009}
  body.pin #bar{position:static;box-shadow:none}
  body.glass:not(.pin) #bar{background:color-mix(in srgb,var(--card) 62%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px #0005}
  body.glass2:not(.pin) #bar{background:color-mix(in srgb,var(--card) 30%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:none}
  #bar{transition:opacity .25s}#bar.fade{opacity:0;pointer-events:none}
  body.pin #strip{display:none}
  .brand{font-size:19px;font-weight:700;margin-right:4px}
  .seg{display:flex;padding:4px;gap:4px;border-radius:11px;background:var(--card2)}
  .seg button{height:40px;padding:0 14px;border-radius:8px;border:0;background:transparent;font-size:15px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
  .seg button.on{background:var(--qty);color:var(--qink)}
  .pchips{display:flex;gap:6px;flex-wrap:wrap}
  .pchip{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:transparent;font-size:15px;font-weight:700;cursor:pointer}
  .pchip.on{background:var(--qty);border-color:var(--qty);color:var(--qink)}
  .bbtn{height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
  .bbtn.on{background:var(--qty);border-color:var(--qty);color:var(--qink)}
  .bbtn.acc{background:var(--qty);border-color:var(--qty);color:var(--qink);font-weight:700}
  .vsep{width:1px;height:30px;background:var(--line)}
  #scrSel{height:40px;font:inherit;font-size:15px;font-weight:600;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
  /* พื้นที่ทำงาน */
  #wrap{flex:1;min-height:0;display:flex;gap:var(--gap);padding:12px 14px}
  #board{position:relative;flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .grid{display:grid;gap:var(--gap);align-items:start;align-content:start}
  .grid.eq{align-items:stretch}
  .empty{text-align:center;color:var(--muted);padding:90px 20px;font-size:22px}
  /* การ์ดโต๊ะ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .card .stp{height:calc(6px*var(--z))}
  .card[data-sm=border][data-s=warn]{border:2px solid #f5b83d}.card[data-sm=border][data-s=late]{border:2px solid #ff5a52}
  .card[data-s=late]{box-shadow:0 0 0 1px #ff5a52aa}
  .s-fresh{background:#2fd07a}.s-warn{background:#f5b83d}.s-late{background:#ff5a52}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px*var(--z)) calc(12px*var(--z)) calc(5px*var(--z))}
  .card[data-sm=head][data-s=fresh] .ch{background:#2fd07a2e}.card[data-sm=head][data-s=warn] .ch{background:#f5b83d38}.card[data-sm=head][data-s=late] .ch{background:#ff5a5240}
  .tl{font-size:calc(var(--fs-table)*var(--z));font-weight:700;line-height:1.15;color:var(--tbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .tm{flex:none;font-size:calc(var(--fs-time)*var(--z));font-weight:700;padding:2px 9px;border-radius:8px}
  .tm.fresh{color:#2fd07a;background:#2fd07a24}.tm.warn{color:#f5b83d;background:#f5b83d29}.tm.late{color:#ff5a52;background:#ff5a5229}
  .meta{padding:0 calc(12px*var(--z)) calc(7px*var(--z));display:flex;flex-wrap:wrap;gap:6px;font-size:calc(13px*var(--z));color:var(--muted)}
  .tag{font-size:calc(12px*var(--z));font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .tag.unpaid{background:#d93a33;color:#fff}.tag.new{background:#6cc4ff;color:#0b1a2a}.tag.thai{background:#1f9d5c;color:#fff}
  .tag.bat{background:#b98bff2e;color:#c9b3ff;border-radius:20px;padding:1px 7px}
  .alert{margin:0 calc(10px*var(--z)) calc(6px*var(--z));padding:6px 10px;border-radius:8px;border:1px solid #f5b83d;background:#f5b83d24;color:#f5b83d;font-size:calc(14px*var(--z));font-weight:700;text-align:left;cursor:pointer}
  .rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .dr{display:flex;align-items:center;gap:calc(10px*var(--z));padding:var(--pad);border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%;color:var(--text)}
  .dr.isnew{background:#6cc4ff1a}
  .dr.done{opacity:.45}.dr.done .nm{text-decoration:line-through}
  .fin.go{border-color:#2fd07a;color:#2fd07a;font-weight:700}.fin small{font-weight:600;opacity:.8}
  .dr.canc{background:#d93a331f;color:#ff7a72}.dr.canc .nm{text-decoration:line-through}
  .qc{flex:none;width:calc(var(--fs-qty)*var(--z));height:calc(var(--fs-qty)*var(--z));border-radius:50%;background:var(--qty);color:var(--qink);display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-qty)*.56*var(--z));font-weight:700}
  .q1{flex:none;width:calc(var(--fs-qty)*var(--z));text-align:center;font-size:calc(var(--fs-opt)*var(--z));color:var(--muted)}
  .dm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .nl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nm{font-size:calc(var(--fs-name)*var(--z));font-weight:600;line-height:1.25;color:var(--text)}
  .op{font-size:calc(var(--fs-opt)*var(--z));font-weight:600;color:var(--opt)}
  .rk{align-self:flex-start;font-size:calc(var(--fs-rmk)*var(--z));font-weight:700;color:#fff;background:var(--rmk);border-radius:6px;padding:1px 8px}
  .pr{flex:none;font-size:calc(14px*var(--z));color:var(--muted)}
  .bx{flex:none;display:flex;gap:calc(5px*var(--z));flex-wrap:wrap;justify-content:flex-end;max-width:calc((var(--box) + 5px)*4*var(--z))}
  .b{width:calc(var(--box)*var(--z));height:calc(var(--box)*var(--z));border-radius:calc(7px*var(--z));border:2px solid #5b6573;display:grid;place-items:center;color:transparent;font-size:calc(var(--box)*.6*var(--z));font-weight:900}
  .b.on{background:#2fd07a;border-color:#2fd07a;color:#06240f}
  .bp{font-size:calc(14px*var(--z));font-weight:700;color:#f5b83d}
  .more{padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--qty);font-size:calc(14px*var(--z));font-weight:700;text-align:left;cursor:pointer}
  .cf{margin-top:auto;padding:calc(9px*var(--z)) calc(11px*var(--z)) calc(11px*var(--z))}
  .fin{width:100%;min-height:calc(46px*var(--z));border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:calc(15px*var(--z));font-weight:600;cursor:pointer}
  .fin.armed{background:#f5b83d;border-color:#f5b83d;color:#1a1100;font-weight:700}
  .fin.ok{background:#2fd07a;border-color:#2fd07a;color:#06240f;font-weight:700}
  /* แบบแถวยาว */
  .trow{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);display:flex;align-items:stretch;overflow:hidden;min-width:0}
  .trow .th{flex:none;width:calc(150px*var(--z));padding:calc(10px*var(--z));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
  .trow .th .stp{height:5px;border-radius:3px}
  .trow .tds{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;padding:calc(8px*var(--z));align-content:flex-start}
  .trow .dr{width:auto;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
  .trow .cf{margin:0;flex:none;width:calc(150px*var(--z));display:flex;align-items:center}
  /* ตามเมนู */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(440px*var(--z)),1fr));gap:var(--gap);align-content:start}
  .mc{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .mc[data-s=late]{border-color:#ff5a52}
  .mh{display:flex;align-items:center;gap:12px}
  .mq{flex:none;width:calc(54px*var(--z));height:calc(54px*var(--z));border-radius:50%;background:var(--qty);color:var(--qink);display:grid;place-items:center;font-size:calc(28px*var(--z));font-weight:700}
  .mn{font-size:calc((var(--fs-name) + 4px)*var(--z));font-weight:700;color:var(--text)}
  .ms{font-size:calc(var(--fs-opt)*var(--z));font-weight:600;color:var(--opt)}
  .mall{margin-left:auto;flex:none;height:46px;padding:0 14px;border-radius:10px;border:2px solid #2fd07a;background:transparent;color:#2fd07a;font-size:15px;font-weight:700;cursor:pointer}
  .mchips{display:flex;flex-wrap:wrap;gap:7px}
  .mchip{min-height:48px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:7px;cursor:pointer;font-size:calc(16px*var(--z));text-align:left}
  .mchip .w{font-weight:700}.mchip .v{font-weight:600;color:var(--opt)}.mchip .x{font-weight:700;color:var(--qty)}
  .mchip.done{background:#12301f;border-color:#1f7a47;color:#9be8b8}.mchip.done .v{color:#9be8b8}
  .mchip .sd{width:9px;height:9px;border-radius:50%}
  .mini{display:flex;gap:3px}.mini i{width:12px;height:12px;border-radius:3px;border:2px solid #5b6573}.mini i.on{background:#2fd07a;border-color:#2fd07a}
  /* แผงทำรวม */
  .rail{flex:none;width:260px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .rh{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .rh b{font-size:17px}
  .rx{width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
  .rb{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .ri{border-radius:11px;border:1px solid var(--line);background:var(--card2);text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
  .ri .t{display:flex;align-items:baseline;gap:8px}.ri .t b{font-size:22px;color:var(--qty)}.ri .t span{font-size:17px;font-weight:700;flex:1}.ri .t i{font-style:normal;font-size:13px;color:var(--muted)}
  .ri .v{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:14px;padding-top:3px;border-top:1px dashed var(--line)}.ri .v b{color:var(--opt);font-size:15px}.ri .v span{color:var(--muted)}.ri .v .vr{flex-basis:100%;font-style:normal;font-weight:700;font-size:13px;color:#fff;background:var(--rmk);border-radius:6px;padding:0 7px;align-self:flex-start;flex-basis:auto}
  .rnote{font-size:13px;color:var(--muted);text-align:center}
  #railFab{position:fixed;right:16px;bottom:16px;z-index:30;height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #b98bff;background:var(--card);color:#c9b3ff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #0009}
  #moreChip{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;height:48px;padding:0 18px;border-radius:24px;border:1.5px solid var(--qty);background:var(--card);color:var(--qty);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 28px #0009}
  /* เสร็จแล้ว */
  .dn .ch{background:transparent}.dn .tm{color:#2fd07a;background:#2fd07a24}
  .recall{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:15px;font-weight:600;cursor:pointer}
  /* แจ้งเตือน */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;display:flex;flex-direction:column;gap:8px;z-index:70;width:min(92vw,440px);pointer-events:none}
  .toast{background:var(--card);border:1px solid #b98bff;border-left-width:4px;border-radius:11px;padding:11px 14px;box-shadow:0 10px 30px -10px #000a}
  .toast b{display:block;font-size:15px}.toast span{font-size:13px;color:var(--muted)}
  #linkBar{position:fixed;top:0;left:0;right:0;z-index:80;background:#d93a33;color:#fff;font-weight:700;text-align:center;padding:10px 14px;font-size:16px}
  #nagBar{position:fixed;left:0;right:0;bottom:0;z-index:75;background:#ffb020;color:#1a1100;font-weight:800;text-align:center;padding:14px;font-size:18px;cursor:pointer}
  /* ---------- หน้าปรับแต่ง ---------- */
  #set{position:fixed;inset:0;z-index:60;background:#0e1014;color:#f3f5f7;display:flex;flex-direction:column}
  .sh{flex:none;min-height:64px;padding:8px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #2a313b;background:#151920}
  .sh .tt{font-size:21px;font-weight:700}
  .sbody{flex:1;min-height:0;display:flex}
  .snav{flex:none;width:210px;padding:12px 10px;border-right:1px solid #2a313b;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  .snav button{min-height:50px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:#a3adba;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
  .snav button.on{background:#232934;color:#fff}
  .snav .nt{margin-top:auto;font-size:13px;line-height:1.5;color:#a3adba;padding:8px}
  .smain{flex:1;min-width:0;padding:16px 24px 40px;overflow-y:auto}
  .smain h2{margin:0;font-size:22px}.smain .hint0{font-size:14px;color:#a3adba;margin:4px 0 10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #222831}
  .row .l{min-width:0;display:flex;flex-direction:column;gap:1px}.row .l b{font-size:16px;font-weight:600}.row .l span{font-size:13px;color:#a3adba}
  .sseg{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;padding:3px;gap:3px;border-radius:10px;background:#1f242c}
  .sseg button{min-height:40px;padding:0 13px;border-radius:8px;border:0;background:transparent;color:#d7dce3;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .sseg button.on{background:#ff9f1c;color:#1a1100}
  .tg{flex:none;width:56px;height:32px;border-radius:16px;border:0;background:#3a414c;padding:0 3px;cursor:pointer;display:flex;align-items:center}
  .tg i{width:26px;height:26px;border-radius:50%;background:#fff}.tg.on{background:#2fd07a;justify-content:flex-end}
  .stp2{flex:none;display:flex;align-items:center;gap:4px}
  .stp2 button{width:42px;height:42px;border-radius:9px;border:1px solid #3a414c;background:#1f242c;color:#f3f5f7;font-size:20px;cursor:pointer}
  .stp2 span{min-width:72px;text-align:center;font-size:15px;font-weight:700}
  .shd{font-size:17px;font-weight:700;color:#ff9f1c;padding:16px 0 2px}
  .smp{display:flex;align-items:center;gap:12px;margin:8px 0;padding:12px 14px;border-radius:12px;background:#1a2230;border:1px solid #2b3a52}
  .smp div{flex:1;min-width:0}.smp small{display:block;font-size:13px;color:#a3adba}.smp b{font-size:17px;font-weight:600;color:#eaf4ff}
  .smp button{flex:none;height:42px;padding:0 14px;border-radius:10px;border:0;background:#6cc4ff;color:#0b1a2a;font-size:15px;font-weight:700;cursor:pointer}
  .tinp{height:42px;font:inherit;font-size:15px;padding:0 10px;border-radius:9px;border:1px solid #3a414c;background:#1f242c;color:#f3f5f7}
  .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:10px}
  .pcard{border-radius:14px;border:2px solid #2a313b;background:#171b21;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
  .pcard.on{border-color:#ff9f1c}.pcard b{font-size:18px}.pcard small{font-size:14px;color:#a3adba}
  .pcard .sw{display:flex;gap:5px}.pcard .sw i{width:22px;height:22px;border-radius:6px;border:1px solid #3a414c}
  .pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
  .pcard .acts button{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid #3a414c;background:#1f242c;color:#d7dce3;font-size:13px;cursor:pointer}
  .badge{font-size:12px;font-weight:700;color:#06240f;background:#2fd07a;border-radius:6px;padding:1px 7px;margin-left:6px}
  .pnew{border-radius:14px;border:2px dashed #3a414c;background:transparent;color:#a3adba;font-size:16px;font-weight:600;cursor:pointer;min-height:120px}
  .themes{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid #2a313b}
  .themes button{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid #3a414c;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}

  .el{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid #222831;flex-wrap:wrap}
  .el>b{flex:none;width:150px;font-size:15px;font-weight:600}
  .el .smpl{flex:1;min-width:120px;height:46px;display:flex;align-items:center;overflow:hidden}
  .el .sws{flex:none;display:flex;gap:6px}
  .el .sws button{width:32px;height:32px;border-radius:50%;border:2px solid #3a414c;padding:0;cursor:pointer}
  .el .sws button.on{border:3px solid #fff}
  .el input[type=color]{width:40px;height:34px;border:0;background:none;padding:0;cursor:pointer}
  .spv{flex:none;width:390px;padding:14px 16px;border-left:1px solid #2a313b;background:#12151a;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .spv .cap{font-size:13px;color:#a3adba}
  .mb{height:120px;border-radius:10px;border:1px solid #2a313b;padding:8px;display:flex;gap:6px}
  .mb .r{flex:none;width:44px;border-radius:5px;background:#b98bff59}
  .mb .g{flex:1;min-width:0;display:grid;align-content:start}
  .mb .g i{border-radius:4px;display:flex;align-items:center;padding-left:5px}

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const toMs=t=>{t=Number(t)||0;return t<1e12?t*1000:t;};
const nk=s=>String(s||'').replace(/\s+/g,'');
// ---- จอไหน (?screen=) ใช้ร่วมกับจอเดิม ----
const SCREEN=(()=>{const q=new URLSearchParams(location.search).get('screen');if(q){try{localStorage.setItem('kds_screen',q);}catch(e){}return q;}
  try{return localStorage.getItem('kds_screen')||'';}catch(e){return '';}})();
const SK=k=>SCREEN&&SCREEN!=='main'?k+'_'+SCREEN:k;
// ---- ค่าเสียงของจอเดิม (อ่านอย่างเดียว) ----
const OLD={snd:Object.assign({type:'bell',vol:'1',rep:'2',add:'chime',cancel:'warn',tick:'off',nag:'0'},LS.get('kds_snd',{})),
  tts:Object.assign({only:[],skip:null,voice:'',pitch:1,rate:1},LS.get('kds_tts',{})),
  call:Object.assign({skip:null},LS.get('kds_call',{})), nob:LS.get('kds_nobatch',null), view:LS.get('kds_view',{})};
const NOB=Array.isArray(OLD.nob)?OLD.nob:['ข้าวสวย'];

// ================= ค่าตั้ง (ชุดค่าตั้ง) =================
const BASE={layout:'card',cols:'auto',density:'normal',rail:'right',sort:'wait',barHide:'4',barOpen:'double',barGlass:'glass',warn:10,late:15,
  sz:{table:30,name:20,qty:32,opt:15,rmk:15,time:15},
  cl:{table:'#F3F5F7',name:'#F3F5F7',qty:'#FF9F1C',opt:'#6CC4FF',rmk:'#D93A33',card:'#171B21',bg:'#0B0D10'},
  show:{wait:true,at:true,type:true,staff:false,opt:true,rmk:true,thai:true,newTag:true,batch:true,boxes:false,price:false,merge:true},
  snd:{vol:'same',tts:true,call:true,tick:false},
  card:{zoom:100,wMode:'auto',w:300,hMode:'auto',limit:5,gap:'normal',radius:'round',box:'m',status:'top',flow:'pack',confirm:false},
  voice:{order:'table-menu',qty:true,opt:true,rmk:true,pre:'none',group:true,rep:'2',rate:'1',callOrder:'table-menu',post:'none',only:false}};
const clone=o=>JSON.parse(JSON.stringify(o));
const DEF={normal:BASE,
  busy:Object.assign(clone(BASE),{cols:'5',density:'tight',rail:'off',sz:{table:24,name:17,qty:26,opt:14,rmk:14,time:14},
    show:Object.assign(clone(BASE.show),{at:false,type:false}),card:Object.assign(clone(BASE.card),{zoom:90,hMode:'limit',limit:4,gap:'tight'}),
    voice:Object.assign(clone(BASE.voice),{order:'menu-table',opt:false,rep:'1'})}),
  night:Object.assign(clone(BASE),{cl:{table:'#FFE2D2',name:'#FFE2D2',qty:'#FF9A5A',opt:'#FFB99A',rmk:'#B4261E',card:'#1A120E',bg:'#0D0806'},snd:Object.assign(clone(BASE.snd),{vol:'low'})})};
const GROUPS=['sz','cl','show','snd','card','voice'];
let ST=LS.get('kds2_cfg',null);
if(!ST||typeof ST!=='object'){
  // ครั้งแรก: เอานิสัยจากจอเดิมมาเป็นค่าเริ่มต้น (อ่านอย่างเดียว ไม่แก้ของเดิม)
  const v=OLD.view,t=OLD.tts,c=OLD.call,seed={};
  if(+v.warn)seed.warn=+v.warn;if(+v.late)seed.late=+v.late;
  seed.snd={tts:!!t.on,call:c.when!=='off'};seed.voice={rate:String(+t.rate||1),only:!!(t.only&&t.only.length)};
  if(t.repeat)seed.voice.rep=t.repeat==='u'?'u':String(Math.min(3,+t.repeat||1));
  ST={active:'normal',presets:{normal:seed,busy:{voice:{rate:seed.voice.rate,only:seed.voice.only},snd:{tts:seed.snd.tts,call:seed.snd.call}},night:{voice:{rate:seed.voice.rate,only:seed.voice.only},snd:{tts:seed.snd.tts,call:seed.snd.call,vol:'low'}}},
    names:{normal:'ปกติ',busy:'ช่วงยุ่ง',night:'กลางคืน'},list:['normal','busy','night'],
    auto:{busyOn:true,busyAt:6,timeOn:false,busyFrom:'18:00',busyTo:'21:00',nightFrom:'22:00'}};
  LS.set('kds2_cfg',ST);
}
ST.presets=ST.presets||{};ST.names=ST.names||{};ST.list=Array.isArray(ST.list)&&ST.list.length?ST.list:['normal','busy','night'];
ST.auto=Object.assign({busyOn:true,busyAt:6,timeOn:false,busyFrom:'18:00',busyTo:'21:00',nightFrom:'22:00'},ST.auto||{});
if(!ST.list.includes(ST.active))ST.active=ST.list[0];
const saveST=()=>LS.set('kds2_cfg',ST);
// test-1.77: ผู้ใช้ขอเอาช่องติ๊กออก → ล้างค่าเดิมทุกชุดครั้งเดียว (ยังเปิดกลับได้ในปรับแต่ง)
if(!ST.mig178){Object.values(ST.presets).forEach(p=>{if(p&&['5','10','30'].includes(String(p.barHide)))delete p.barHide;});ST.mig178=1;saveST();}
if(!ST.mig177){Object.values(ST.presets).forEach(p=>{if(p&&p.show)delete p.show.boxes;if(p&&p.card)delete p.card.confirm;});ST.mig177=1;saveST();}
function cfg(k){const b=DEF[k]||(ST.presets[k]&&ST.presets[k]._base&&DEF[ST.presets[k]._base])||BASE,o=ST.presets[k]||{},r=Object.assign({},b,o);
  GROUPS.forEach(g=>{r[g]=Object.assign({},b[g],o[g]||{});});return r;}
function patch(k,p){const o=ST.presets[k]||(ST.presets[k]={});
  Object.keys(p).forEach(x=>{if(p[x]&&typeof p[x]==='object'&&!Array.isArray(p[x]))o[x]=Object.assign({},o[x]||{},p[x]);else o[x]=p[x];});saveST();}

// ---- ชุดที่ใช้อยู่: เลือกเอง หรือสลับอัตโนมัติ (ออเดอร์เยอะ / ตามเวลา) ----
let manualAt=0,autoP='';
const hm=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return(a||0)*60+(b||0);};
function inRange(a,b){const d=new Date(),n=d.getHours()*60+d.getMinutes(),x=hm(a),y=hm(b);return x<=y?n>=x&&n<y:n>=x||n<y;}
function decideAuto(){const A=ST.auto;let p='';
  if(Date.now()-manualAt<180000)return '';
  if(A.timeOn){if(ST.list.includes('night')&&inRange(A.nightFrom,'06:00'))p='night';else if(ST.list.includes('busy')&&inRange(A.busyFrom,A.busyTo))p='busy';}
  if(A.busyOn&&ST.list.includes('busy')){const n=ORDERS.length;
    if(n>=(+A.busyAt||6))p='busy';else if(autoP==='busy'&&n>Math.max(0,(+A.busyAt||6)-2))p='busy';}
  return p===ST.active?'':p;}
const activeKey=()=>autoP||ST.active;
let C=cfg(activeKey());

// ---- ค่าตั้ง → ตัวแปร CSS ----
const hex=h=>{h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return[n>>16,(n>>8)&255,n&255];};

    '--muted':mix(text,card,.38),'--qty':c.cl.qty,'--qink':lum(c.cl.qty)>.6?'#1a1100':'#ffffff','--opt':c.cl.opt,'--rmk':c.cl.rmk,
    '--fs-table':c.sz.table+'px','--fs-name':c.sz.name+'px','--fs-qty':c.sz.qty+'px','--fs-opt':c.sz.opt+'px','--fs-rmk':c.sz.rmk+'px','--fs-time':c.sz.time+'px',
    '--z':z,'--pad':({comfy:'13px 14px',normal:'9px 12px',tight:'5px 10px'})[c.density]||'9px 12px',
    '--box':({s:'20px',m:'26px',l:'34px'})[c.card.box]||'26px','--gap':({tight:'8px',normal:'12px',wide:'20px'})[c.card.gap]||'12px',
    '--rad':({square:'4px',round:'14px',pill:'22px'})[c.card.radius]||'14px'};
  return v;}
const styleStr=v=>Object.keys(v).map(k=>k+':'+v[k]).join(';');
function applyVars(){C=cfg(activeKey());const v=varsOf(C),r=document.documentElement;Object.keys(v).forEach(k=>r.style.setProperty(k,v[k]));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=C.cl.bg;
  document.body.classList.toggle('pin',+C.barHide===0);
  document.body.classList.toggle('glass',C.barGlass==='glass');document.body.classList.toggle('glass2',C.barGlass==='clear');}

// ================= ข้อมูลออเดอร์ =================
let ORDERS=[],primed=false,KNOWN=[],CATS=[];
const PLATE=new Map(Object.entries(LS.get('kds2_plate',{})).filter(([k,v])=>v&&v[1]>Date.now()-864e5).map(([k,v])=>[k,v[0]]));
const PLATE_T={};
const savePlate=()=>{const o={};for(const[k,v]of PLATE)o[k]=[v,PLATE_T[k]||Date.now()];LS.set('kds2_plate',o);};
const LOCALDONE=new Map();   // id -> เวลา (กดเสร็จที่จอนี้ รอเซิร์ฟเวอร์ตอบ)
const LOCALUNDO=new Map();
const ACK=new Map(Object.entries(LS.get('kds2_ack',{})).filter(([k,v])=>v>Date.now()-864e5));
const saveAck=()=>LS.set('kds2_ack',Object.fromEntries(ACK));
const ADDED=new Set(),MOVED=new Map(),GHOSTC=new Map(),EXP=new Set();
const seenO=new Set(),seenD=new Set();
const dz=d=>({id:d.id,name:d.name,q:+d.quantity||1,opt:[d.spec,...(d.extra_option||[]),...(d.extra_needing||[])].filter(Boolean),rmk:d.remark||'',
  at:toMs(d.at),thai:!!d.thai,cat:d.cat||'',price:d.price,by:d.by||''});
function norm(raw){const now=Date.now();
  for(const[k,t]of[...LOCALDONE])if(now-t>15000)LOCALDONE.delete(k);
  for(const[k,t]of[...LOCALUNDO])if(now-t>15000)LOCALUNDO.delete(k);
  return(raw||[]).map(o=>{let pend=(o.pending_dishes||[]).map(dz),fin=(o.completed_dishes||[]).map(dz);
    pend.filter(d=>LOCALDONE.has(d.id)).forEach(d=>{if(!fin.some(x=>x.id===d.id))fin.push(d);});pend=pend.filter(d=>!LOCALDONE.has(d.id));
    fin.filter(d=>LOCALUNDO.has(d.id)).forEach(d=>pend.push(d));fin=fin.filter(d=>!LOCALUNDO.has(d.id));
    return{id:o.id,table:o.table_num||'',code:o.pick_up_code||'',type:String(o.order_type||'dine_in'),plat:o.third_party_platform||'',
      unpaid:!!o.unpaid,urge:!!o.is_urge,at:toMs(o.order_at),by:o.by||'',pend,fin,canc:(o.cancelled_dishes||[]).map(dz)};}).filter(o=>o.pend.length);}
const label=(o,short)=>o.table?(short?'':'โต๊ะ ')+o.table:o.code?(short?'#':'กลับบ้าน #')+o.code:(o.plat||'เดลิเวอรี');
const where=o=>o.table?'โต๊ะ '+o.table:o.code?'กลับ #'+o.code:(o.plat||'ส่ง');
const spokenHead=o=>o.table?'โต๊ะ '+o.table:o.code?'กลับบ้าน หมายเลข '+o.code:(o.plat||'เดลิเวอรี');
const TYPE={dine_in:'กินที่ร้าน',takeaway:'กลับบ้าน',delivery:'เดลิเวอรี',self_pick_up:'รับเอง'};
const plates=d=>Math.min(PLATE.get(d.id)||0,d.q);
const leftOfO=o=>o.pend.reduce((n,d)=>n+d.q-plates(d),0);
const startOf=o=>o.pend.length?Math.min(...o.pend.map(d=>d.at||o.at)):o.at;
function sevOf(t,c){const m=Math.max(0,Math.floor((Date.now()-t)/60000));return{m,s:m>=(+c.late||15)?'late':m>=(+c.warn||10)?'warn':'fresh'};}
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const optTxt=d=>d.opt.join(' · ');
const noBatch=d=>NOB.some(k=>nk(k)&&nk(d.name).includes(nk(k)));

// ---- ทำรวม: เมนูชื่อเดียวกันที่ค้างหลายโต๊ะ ----
function batches(){const m=new Map();
  for(const o of ORDERS)for(const d of o.pend){if(noBatch(d))continue;const l=d.q-plates(d);if(!l)continue;
    if(!m.has(d.name))m.set(d.name,{name:d.name,total:0,tables:new Set(),vars:new Map()});
    const b=m.get(d.name);b.total+=l;b.tables.add(o.id);const v=optTxt(d)+'|'+d.rmk;
    if(!b.vars.has(v))b.vars.set(v,{q:0,wm:new Map(),opt:optTxt(d)||'ธรรมดา',rmk:d.rmk});const x=b.vars.get(v);x.q+=l;const wk=where(o).replace('โต๊ะ ','');x.wm.set(wk,(x.wm.get(wk)||0)+l);}
  for(const b of m.values())for(const x of b.vars.values())x.w=[...x.wm].map(([k,q])=>k+(q>1?' ×'+q:''));
  return[...m.values()].filter(b=>b.total>1).sort((a,b)=>b.total-a.total);}   // test-1.80: เหลือ 2 ที่ขึ้นไปก็ขึ้น แม้โต๊ะเดียว

// ================= วาดหน้าจอ =================
let view='table',viewManual=false;
function sortO(list,c){const by=c.sort;return[...list].sort((a,b)=>by==='new'?startOf(b)-startOf(a):by==='table'?String(a.table||a.code).localeCompare(String(b.table||b.code),'th',{numeric:true}):startOf(a)-startOf(b));}
// test-1.75: จานที่เหมือนกันทุกอย่าง (ชื่อ ตัวเลือก หมายเหตุ คนไทย ใหม่) ในโต๊ะเดียวกัน → บรรทัดเดียว · id = "i1,i2,…"
const isNewD=d=>(d._ids||[d.id]).some(x=>ADDED.has(x));
function mergeL(list,pend){const out=[],at=new Map();
  for(const d of list){const k=d.name+'|'+d.opt.join('/')+'|'+d.rmk+'|'+(d.thai?1:0)+'|'+(isNewD(d)?1:0);const m=at.get(k);
    if(m){m.q+=d.q;m._ids.push(d.id);m.id=m._ids.join(',');if(pend)m._plates+=plates(d);continue;}
    const g={...d,_ids:[d.id],_plates:pend?plates(d):0};at.set(k,g);out.push(g);}
  return out;}
function dishHtml(o,d,st,c,bcount){
  const done=st==='done',canc=st==='cancel',n=done?d.q:(d._ids?d._plates:plates(d));
  const multi=d.q>1&&!canc;

  const tags=[];

  if(c.show.thai&&d.thai)tags.push('<span class="tag thai">คนไทย</span>');

  const note=canc?'<span class="op" style="color:#ff7a72;font-weight:700">ยกเลิกแล้ว · แตะรับทราบ</span>':'';
  const price=c.show.price&&d.price!=null&&!canc?`<span class="pr">฿${esc(d.price)}</span>`:'';

    else if(c.show.boxes)bx=`<span class="bp">${n}/${d.q}</span>`;else if(!done&&n>0)bx=`<span class="bp">เสร็จ ${n}/${d.q}</span>`;}
  const cls=done?' done':canc?' canc':(isNewD(d)&&c.show.newTag?' isnew':'');
  return `<button class="dr${cls}" data-act="${canc?'ack':done?'undo':'tick'}" data-o="${esc(o.id)}" data-d="${esc(d.id)}">${qv}

function cancelsOf(o){const l=[...o.canc,...[...GHOSTC.values()].filter(e=>e.oid===o.id).map(e=>e.d)];

function cardHtml(o,c,bcount,opts){opts=opts||{};

  const meta=[c.show.type?TYPE[o.type]||'':'',c.show.at?'สั่ง '+hhmm(o.at):'',c.show.staff&&(o.by||(o.pend[0]&&o.pend[0].by))?'โดย '+(o.by||o.pend[0].by):''].filter(Boolean);

  if(kind==='order')playPat(S.type,+S.rep||2);
  else if(kind==='add'){if(S.add==='off')return;if(S.add==='same')playPat(S.type,+S.rep||2);else playPat(S.add,1);}
  else if(kind==='cancel'){if(S.cancel==='off')return;playPat(S.cancel||'warn',1);}
  else playPat('warn',1);}

function dishWords(ds,V){const part=(name,q,opt,rmk)=>[name,V.qty?q+' ที่':'',V.opt&&opt?opt:'',V.rmk&&rmk?'หมายเหตุ '+rmk:''].filter(Boolean).join(' ');
  if(!V.group)return ds.map(d=>part(d.name,d.q,d.opt.join(' '),d.rmk)).join(', ');
  const by=new Map();for(const d of ds){if(!by.has(d.name))by.set(d.name,[]);by.get(d.name).push(d);}
  return[...by].map(([name,l])=>{const tot=l.reduce((a,d)=>a+d.q,0);
    if(l.length===1)return part(name,tot,l[0].opt.join(' '),l[0].rmk);
    const vs=new Map();l.forEach(d=>{const k=V.opt?d.opt.join(' '):'';vs.set(k,(vs.get(k)||0)+d.q);});

    h+=`<div class="row"><span class="l"><b>เสียงเตือน 36 แบบ และเสียงผู้พูดภาษาไทย</b><span>ใช้ค่าจาก ⚙️ ตั้งค่าเสียง ของจอเดิม (ตั้งที่เดียว ใช้ได้ทั้งสองจอ) · กด “จอเดิม” ที่แถบบนเพื่อไปตั้ง</span></span></div>`;
    h+=segH('ความดังของชุดนี้','',c.snd.vol,[['same','ตามที่ตั้งไว้'],['low','เบา'],['high','ดัง'],['max','ดังสุด']],v=>sv({snd:{vol:v}}));
    h+=headH('อ่านออกเสียงออเดอร์ใหม่');
    h+=togH('เปิดอ่านออกเสียง','',c.snd.tts,v=>sv({snd:{tts:v}}));
    h+=segH('ลำดับการอ่าน','',V.order,[['table-menu','โต๊ะ → เมนู'],['menu-table','เมนู → โต๊ะ'],['menu','เมนูอย่างเดียว'],['table','โต๊ะอย่างเดียว']],svv('order'));
    h+=sampleH('ตัวอย่างเมื่อโต๊ะ 5 สั่งเข้ามา',orderSentence('โต๊ะ 5',D,V),V.rate);
    h+=togH('อ่านจำนวน','เช่น “2 ที่”',V.qty,svv('qty'))+togH('อ่านตัวเลือก','เนื้อสัตว์ ขนาด ความเผ็ด',V.opt,svv('opt'))+togH('อ่านหมายเหตุ / แพ้อาหาร','',V.rmk,svv('rmk'));
    h+=segH('คำขึ้นต้น','',V.pre,[['none','ไม่มี'],['new','ออเดอร์ใหม่'],['come','มาแล้ว']],svv('pre'));
    h+=togH('รวมเมนูเดียวกันในโต๊ะ','อ่าน “กะเพรา 3 ที่ หมู 2 ไก่ 1” แทนอ่านทีละจาน',V.group,svv('group'));
    h+=togH('อ่านเฉพาะเมนูที่เลือกไว้ในจอเดิม',(OLD.tts.only||[]).length?'จอเดิมเลือกไว้ '+OLD.tts.only.length+' เมนู':'จอเดิมยังไม่ได้เลือกเมนู (ปิดไว้ = อ่านทุกเมนู)',V.only,svv('only'));
    h+=segH('อ่านซ้ำ','ทุก 15 วินาที จนกว่าจะแตะจานของโต๊ะนั้น',V.rep,[['1','ครั้งเดียว'],['2','2 รอบ'],['3','3 รอบ'],['u','จนกว่าจะแตะ']],svv('rep'));
    h+=segH('ความเร็ว','',V.rate,[['0.85','ช้า'],['1','ปกติ'],['1.2','เร็ว'],['1.4','เร็วมาก']],svv('rate'));
    h+=headH('เรียกโต๊ะเมื่อจานเสร็จ (ให้คนเสิร์ฟได้ยิน)');
    h+=togH('เปิดเรียกโต๊ะ','',c.snd.call,v=>sv({snd:{call:v}}));
    h+=segH('ลำดับ','',V.callOrder,[['table-menu','โต๊ะ → เมนู'],['menu-table','เมนู → โต๊ะ'],['table','โต๊ะอย่างเดียว']],svv('callOrder'));
    h+=segH('คำลงท้าย','',V.post,[['none','ไม่มี'],['done','เสร็จแล้ว'],['serve','เสิร์ฟได้เลย']],svv('post'));
    h+=sampleH('ตัวอย่างเมื่อกะเพราโต๊ะ 5 เสร็จ',callSentence('โต๊ะ 5',[{name:'กะเพรา',q:2,opt:[],rmk:''}],V),V.rate);
    h+=headH('อื่นๆ')+togH('เสียงสั้นตอนแตะจาน','ยืนยันว่าแตะโดน',c.snd.tick,v=>sv({snd:{tick:v}}));
  }
  $('#smain').innerHTML=h;
  const pin=$('#pnameIn');if(pin)pin.addEventListener('change',()=>{ST.names[ED]=pin.value.trim()||ST.names[ED];saveST();afterSet();});
  renderPreview(c);}
function renderPreview(c){const v=varsOf(c),z=(+c.card.zoom||100)/100,pw=Math.round(Math.min(c.card.wMode==='fixed'?c.card.w:300,340/z)*z);
  const t=Date.now(),o={id:'_pv',table:'12',type:'dine_in',at:t-12*60000,by:'น้ำ',unpaid:false,
    pend:[{id:'_p1',name:'กะเพรา',q:2,opt:['หมูกรอบ','ไข่ดาว'],rmk:'แพ้ถั่ว',at:t-12*60000,price:140},{id:'_p2',name:'ต้มยำกุ้ง',q:1,opt:['น้ำข้น'],rmk:'',at:t-12*60000,price:180},
      {id:'_p3',name:'ผัดไท',q:1,opt:['กุ้ง'],rmk:'',at:t-3*60000,thai:true,price:80}],fin:[],canc:[]};
  const keep=[PLATE.get('_p1'),ADDED.has('_p3')];PLATE.set('_p1',1);ADDED.add('_p3');
  const ws=Object.assign({},v,{'--z':z});
  const html=cardHtml(o,c,{'กะเพรา':5},{preview:true,card:true});
  if(keep[0]==null)PLATE.delete('_p1');else PLATE.set('_p1',keep[0]);if(!keep[1])ADDED.delete('_p3');
  const nCols=c.layout==='row'?1:c.layout==='menu'?2:c.card.wMode==='fixed'?Math.max(1,Math.min(8,Math.floor(1010/(c.card.w*z+12)))):(c.cols==='auto'?Math.max(2,Math.min(8,Math.floor(1010/(280*z+12)))):+c.cols);
  const tiles=c.layout==='row'?6:c.layout==='menu'?6:nCols*2,hh=c.layout==='row'?'14px':c.layout==='menu'?'30px':(nCols>=5?'44px':'50px');
  const SC=['#ff5a52','#f5b83d','#f5b83d','#2fd07a'];
  $('#spv').innerHTML=`<div class="cap" style="font-weight:600">ตัวอย่าง · ชุด “${esc(pname(ED))}”</div>
    <div class="mb" style="background:${c.cl.bg}">${c.rail==='left'?'<span class="r"></span>':''}<span class="g" style="grid-template-columns:repeat(${nCols},minmax(0,1fr));gap:${({tight:'3px',normal:'5px',wide:'9px'})[c.card.gap]}">${Array.from({length:tiles},(_,i)=>`<i style="height:${hh};background:${c.cl.card};border-top:3px solid ${SC[Math.min(i,3)]}">${c.layout==='menu'?`<b style="background:${c.cl.qty}"></b>`:''}</i>`).join('')}</span>${c.rail==='right'?'<span class="r"></span>':''}</div>
    <div class="cap">${c.layout==='row'?'แถวยาว: โต๊ะละ 1 แถว':c.layout==='menu'?'ตามเมนู: จานเดียวกันจากทุกโต๊ะรวมการ์ดเดียว':'การ์ดตามโต๊ะ ราว '+nCols+' คอลัมน์ บนจอกว้าง 1280'}</div>
    <div class="pvw" style="${styleStr(ws)};background:${c.cl.bg}"><div style="width:${Math.round(pw/z)}px;max-width:100%">${html}</div></div>`;}
function afterSet(){renderSet();C=cfg(activeKey());applyVars();}
$('#set').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const f=ACTS[+b.dataset.a];if(f)f();});
$('#set').addEventListener('change',e=>{const t=e.target;if(t.dataset.time){const f=ACTS[+t.dataset.time];if(f)f(t.value);}if(t.dataset.color){const f=ACTS[+t.dataset.color];if(f)f(t.value);}});
function openSet(){ED=activeKey();$('#set').hidden=false;renderSet();}
function closeSet(){$('#set').hidden=true;C=cfg(activeKey());if(!viewManual&&view!=='done')view=C.layout==='menu'?'menu':'table';render();barUpAt=Date.now();}
$('#setBtn').addEventListener('click',openSet);$('#setBack').addEventListener('click',closeSet);$('#setDone').addEventListener('click',closeSet);
$('#setReset').addEventListener('click',()=>{if(DEF[ED]){delete ST.presets[ED];}else{const b=clone(cfg('normal'));b._base='normal';ST.presets[ED]=b;}saveST();afterSet();toast('คืนค่าชุด “'+pname(ED)+'” แล้ว','');});

// ---- เริ่ม ----
try{localStorage.setItem('kds_v2','1');}catch(e){}   // เปิดจอครัวครั้งหน้า → มาที่จอ 2.0 (กด "จอเดิม" เพื่อกลับ)
view=C.layout==='menu'?'menu':'table';
applyVars();if(+C.barHide>0)showBar();render();poll();setInterval(poll,2500);clockTick();setInterval(clockTick,1000);
</script>
