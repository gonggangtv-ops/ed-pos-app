# สร้างไฟล์ติดตั้ง (.apk) อัตโนมัติทุกครั้งที่มีการอัปเดตโค้ด แล้ววางไว้ที่หน้า Releases
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ed-pos-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ed-pos-app
          path: ed-pos-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ED POS แอป 1.${{ github.run_number }}
          body: ดาวน์โหลด ed-pos-app.apk แล้วติดตั้งบนแท็บเล็ต (ติดตั้งทับรุ่นเก่าได้เลย)
          files: ed-pos-app.apk
          make_latest: true
