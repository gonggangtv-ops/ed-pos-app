# สร้างไฟล์ติดตั้ง (.apk) อัตโนมัติทุกครั้งที่มีการอัปเดตโค้ด แล้ววางไว้ที่หน้า Releases
# · ed-pos-app.apk = MAMA POS (แท็บเล็ตหน้าร้าน/จอครัว/หลังร้าน)
# · mama-kitchen.apk = ผู้ช่วยครัว น้องมาม่า (มือถือในครัว สั่งงานด้วยเสียง)
# สาขาอื่นที่ไม่ใช่ main: สร้างไฟล์ไว้ทดสอบเท่านั้น (ไม่ขึ้น Releases)
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test kitchen voice commands
        run: node kitchen/test/test-logic.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle :app:assembleRelease :kitchen:assembleRelease --no-daemon --stacktrace
      - run: |
          cp app/build/outputs/apk/release/app-release.apk ed-pos-app.apk
          cp kitchen/build/outputs/apk/release/kitchen-release.apk mama-kitchen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ed-pos-app.apk
            mama-kitchen.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MAMA POS 1.${{ github.run_number }}
          body: |
            - ed-pos-app.apk — MAMA POS สำหรับแท็บเล็ต (ติดตั้งทับรุ่นเก่าได้เลย)
            - mama-kitchen.apk — ผู้ช่วยครัว "น้องมาม่า" สำหรับมือถือในครัว (ติดตั้งคู่กับ MAMA POS ได้)
          files: |
            ed-pos-app.apk
            mama-kitchen.apk
          make_latest: true
