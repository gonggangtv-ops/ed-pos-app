<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยครัว</title>
<style>
  :root {
    --bg: #121211; --panel: #1d1c1a; --line: #2e2c29; --text: #f6f1df; --dim: #a59f8f;
    --brand: #2f9a7e; --hot: #f2a541; --bad: #e5604d; --ok: #57c18f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; border: 0; background: none; }

  /* ----- แถบบน ----- */
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--panel);
    font-size: 15px; flex: 1; min-width: 0; }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--dim); flex: none; }
  .listening .dot { background: var(--ok); animation: pulse 1.6s infinite; }
  .hearing .dot { background: var(--hot); animation: pulse .6s infinite; }
  .error .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .net { font-size: 13px; color: var(--dim); white-space: nowrap; }
  .net.down { color: var(--bad); }
  .gear { width: 44px; height: 44px; font-size: 24px; border-radius: 12px; background: var(--panel); flex: none; }

  /* ----- คำพูดล่าสุด ----- */
  .talk { padding: 12px 16px 6px; min-height: 92px; }
  .heard { color: var(--dim); font-size: 15px; min-height: 22px; }
  .reply { font-size: 22px; line-height: 1.4; margin-top: 4px; }
  .reply.ask { color: var(--hot); }

  /* ----- แท็บ ----- */
  .tabs { display: flex; gap: 8px; padding: 6px 14px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 12px; background: var(--panel); color: var(--dim); font-size: 17px; }
  .tabs button.on { background: var(--brand); color: #fff; }

  main { flex: 1; overflow-y: auto; padding: 6px 14px 16px; }
  .empty { text-align: center; color: var(--dim); padding: 48px 0; font-size: 19px; }

  /* ทำรวม */
  .grp { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; background: var(--panel); border: 2px solid transparent;
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .grp .name { font-size: 22px; font-weight: 600; }
  .grp .qty { grid-row: span 3; font-size: 44px; font-weight: 700; color: var(--hot); align-self: center; line-height: 1; }
  .grp .opts { color: var(--dim); font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 15px; padding: 3px 10px; border-radius: 99px; background: #2b2a27; }
  .chip.late { background: #5a2a22; color: #ffd2c9; }
  .alert { color: var(--bad); font-weight: 600; }

  /* รายโต๊ะ */
  .ord { background: var(--panel); border: 2px solid transparent; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .ord h3 { margin: 0 0 6px; font-size: 21px; display: flex; justify-content: space-between; gap: 8px; }
  .ord h3 small { font-weight: 400; color: var(--dim); font-size: 15px; }
  .ord h3 small.late { color: var(--bad); }
  .ord li { font-size: 18px; padding: 3px 0; list-style: none; }
  .ord ul { margin: 0; padding: 0; }
  .ord .rm { color: var(--hot); font-size: 15px; }
  .hl { border-color: var(--hot) !important; }

  /* ----- ปุ่มพูด ----- */
  footer { display: flex; gap: 10px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .talkbtn { flex: 1; height: 72px; border-radius: 20px; background: var(--brand); color: #fff; font-size: 21px; font-weight: 600; }
  .talkbtn.active { background: var(--hot); color: #1b1100; }
  .pause { width: 92px; border-radius: 20px; background: var(--panel); font-size: 16px; }
  .pause.on { background: var(--bad); color: #fff; }

  /* ----- ตั้งค่า ----- */
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; padding: 16px 16px 40px; display: none; z-index: 5; }
  .sheet.open { display: block; }
  .sheet h2 { margin: 4px 0 14px; font-size: 22px; }
  .sheet h4 { margin: 22px 0 8px; color: var(--dim); font-weight: 500; font-size: 15px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 15px; color: var(--dim); margin-bottom: 4px; }
  input[type=text], input[type=password], select {
    width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; font-size: 17px; }
  .check input { width: 24px; height: 24px; flex: none; margin-top: 2px; accent-color: var(--brand); }
  .check small { display: block; color: var(--dim); font-size: 14px; }
  .btn { padding: 12px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; }
  .btn.main { background: var(--brand); border-color: var(--brand); color: #fff; }
  .note { color: var(--dim); font-size: 14px; line-height: 1.5; }
  .msg { font-size: 15px; min-height: 20px; margin-top: 6px; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--ok); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 12px 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 22px; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
  .actions .btn { flex: 1; font-size: 18px; padding: 14px; }
</style>
</head>
<body>
<header>
  <div class="pill" id="pill"><i class="dot"></i><span id="status">กำลังเริ่ม…</span></div>
  <div class="net" id="net"></div>
  <button class="gear" id="gear" aria-label="ตั้งค่า">⚙</button>
</header>

<section class="talk">
  <div class="heard" id="heard"></div>
  <div class="reply" id="reply">เรียก “น้องมาม่า” แล้วพูดคำสั่งได้เลยค่ะ</div>
</section>

<nav class="tabs">
  <button class="on" data-tab="groups">ทำรวม</button>
  <button data-tab="tables">รายโต๊ะ</button>
</nav>

<main id="board"><div class="empty">กำลังโหลดออเดอร์…</div></main>

<footer>
  <button class="talkbtn" id="talk">🎙 แตะแล้วพูด</button>
  <button class="pause" id="pause">หยุดฟัง</button>
</footer>

<!-- ตั้งค่า -->
<div class="sheet" id="lock">
  <h2>ใส่รหัสเจ้าของร้าน</h2>
  <div class="field"><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="รหัสเจ้าของร้าน"></div>
  <div class="msg bad" id="pinMsg"></div>
  <div class="actions"><button class="btn" id="pinCancel">ยกเลิก</button><button class="btn main" id="pinOk">เข้าหน้าตั้งค่า</button></div>
</div>

<div class="sheet" id="setup">
  <h2>ตั้งค่าผู้ช่วยครัว</h2>

  <h4>เครื่อง ED POS</h4>
  <div class="field"><label>IP เครื่องหลัก</label>
    <div class="row"><input type="text" id="sMain" inputmode="url" placeholder="เช่น 192.168.1.34"><button class="btn" style="flex:none" data-test="sMain">ทดสอบ</button></div>
    <div class="msg" id="sMainMsg"></div></div>
  <div class="field"><label>IP เครื่องสำรอง (ถ้ามี)</label>
    <div class="row"><input type="text" id="sStandby" inputmode="url" placeholder="เว้นว่างได้"><button class="btn" style="flex:none" data-test="sStandby">ทดสอบ</button></div>
    <div class="msg" id="sStandbyMsg"></div></div>
  <div class="field"><label>ฟังออเดอร์ของจอ</label><select id="sScreen"></select></div>

  <h4>การฟัง</h4>
  <div class="seg" id="sMode">
    <button data-v="wake">ฟังตลอด (เรียกชื่อ)</button>
    <button data-v="ptt">แตะแล้วพูด</button>
  </div>
  <div class="field" style="margin-top:12px"><label>ชื่อเรียก (คั่นด้วย , ใส่คำที่ระบบฟังชอบเขียนผิดเพิ่มได้)</label>
    <input type="text" id="sWake"></div>
  <label class="check"><input type="checkbox" id="sConfirm"><span>ถามยืนยันก่อนกดเสร็จ<small>พูดทวนแล้วรอคำว่า “ใช่” ก่อนทำ (แนะนำ)</small></span></label>
  <label class="check"><input type="checkbox" id="sVolKey"><span>ปุ่มเพิ่ม/ลดเสียง = แตะแล้วพูด<small>ใช้กับปุ่มรีโมตบลูทูธได้ (ปุ่มถ่ายรูปบลูทูธส่วนใหญ่คือปุ่มเพิ่มเสียง)</small></span></label>
  <label class="check"><input type="checkbox" id="sMute"><span>ปิดเสียง “ปิ๊บ” ของระบบฟัง<small>ปิดเสียงสื่อ/แจ้งเตือนของมือถือระหว่างฟัง · เสียงพูดของผู้ช่วยยังดังตามปกติ</small></span></label>

  <h4>เสียงพูด</h4>
  <div class="field"><label>ความเร็ว <b id="sRateV"></b></label><input type="range" id="sRate" min="0.7" max="1.5" step="0.1" style="width:100%"></div>
  <div class="row"><button class="btn" id="tTest">ทดสอบเสียงพูด</button><button class="btn" id="tTts">ตั้งค่าเสียงอ่าน</button></div>
  <div class="msg" id="ttsMsg"></div>
  <p class="note">ให้ฟังภาษาไทยได้แม้เน็ตหลุดและเร็วขึ้น: เปิดแอป Google → รูปโปรไฟล์ → การตั้งค่า → เสียง → การจดจำเสียงพูดแบบออฟไลน์ → ดาวน์โหลด “ไทย”</p>

  <p class="note" id="ver"></p>
  <div class="actions"><button class="btn" id="sCancel">ยกเลิก</button><button class="btn main" id="sSave">บันทึก</button></div>
</div>

<script src="logic.js"></script>
<script>
'use strict';
const K = window.Kit;   // ช่องทางไปแอป (MainActivity.Bridge)
const L = window.KitchenLogic;
const $ = id => document.getElementById(id);

let cfg = JSON.parse(K.getConfig());
let base = '';                 // เครื่องที่ใช้อยู่
let orders = [], screens = [], lastOk = 0, fails = 0;
let tab = 'groups';
let lastSay = '';
let pending = null;            // คำสั่งที่รอ "ใช่"
let followUntil = 0;           // ช่วงที่ตอบได้โดยไม่ต้องเรียกชื่อ (หลังเรียกชื่อ/ถามยืนยัน)
let lastUndo = null;           // {calls, label, at}
let highlight = { orders: [], dishes: [], until: 0 };
let paused = false, speaking = false, onceActive = false, wokeThisRound = false;

// ---------- เครือข่าย (ผ่านแอป ไม่ติด CORS) ----------
const waits = new Map(); let seq = 0;
window.__kit = window.__kit || {};
__kit.http = (id, code, text) => { const w = waits.get(id); if (w) { waits.delete(id); w({ code, text }); } };
function http(method, url, body, timeout) {
  return new Promise(res => {
    const id = 'h' + (++seq);
    waits.set(id, res);
    K.http(id, method, url, body ? JSON.stringify(body) : '', timeout || 4000);
  });
}
async function getJSON(url, timeout) {
  const r = await http('GET', url, null, timeout);
  if (r.code !== 200) return null;
  try { return JSON.parse(r.text); } catch { return null; }
}

async function refresh() {
  const list = [base, cfg.main, cfg.standby].filter((v, i, a) => v && a.indexOf(v) === i);
  for (const b of list) {
    const j = await getJSON(`${b}/api/orders?screen=${encodeURIComponent(cfg.screen || '')}`, 3000);
    if (j && j.ok) {
      base = b; orders = j.orders || []; screens = j.screens || []; lastOk = Date.now(); fails = 0;
      render(); return;
    }
  }
  fails++;
  render();
}

// ---------- พูด / ฟัง ----------
function speak(text, kind) {
  if (!text) return;
  lastSay = text;
  $('reply').textContent = text;
  $('reply').className = 'reply' + (kind === 'ask' ? ' ask' : '');
  K.speak(text, cfg.rate || 1);
}
__kit.tts = state => {
  speaking = state === 'start';
  // พูดจบ → ให้ตอบต่อได้โดยไม่ต้องเรียกชื่อ (กรณีถามยืนยัน/ถามเลขโต๊ะ)
  if (!speaking && (pending || followAfterSpeech)) { followUntil = Date.now() + 8000; followAfterSpeech = false; }
  setStatus();
};
let followAfterSpeech = false;

function setStatus(extra) {
  const pill = $('pill');
  let cls = '', txt;
  if (extra && extra.error) { cls = 'error'; txt = extra.error; }
  else if (speaking) { txt = '🔊 กำลังพูด'; }
  else if (onceActive) { cls = 'hearing'; txt = 'พูดได้เลยค่ะ…'; }
  else if (Date.now() < followUntil) { cls = 'hearing'; txt = pending ? 'ตอบ “ใช่” หรือ “ไม่”' : 'ว่ามาเลยค่ะ…'; }
  else if (paused) { txt = 'หยุดฟังอยู่ (แตะปุ่มเพื่อพูด)'; }
  else if (cfg.mode === 'ptt') { txt = 'แตะปุ่มหรือกดปุ่มเสียงเพื่อพูด'; }
  else if (micState === 'listening') { cls = 'listening'; txt = `ฟังอยู่ · เรียก “${wakeName()}”`; }
  else txt = micMsg || 'กำลังเริ่มฟัง…';
  pill.className = 'pill ' + cls;
  $('status').textContent = txt;
  $('talk').classList.toggle('active', onceActive || Date.now() < followUntil);
  $('pause').classList.toggle('on', paused);
  $('pause').textContent = paused ? 'ฟังต่อ' : 'หยุดฟัง';
  $('pause').style.display = cfg.mode === 'ptt' ? 'none' : '';
}
setInterval(setStatus, 1000);

const wakeList = () => String(cfg.wake || '').split(/[,،]/).map(s => s.trim()).filter(Boolean);
const wakeName = () => wakeList()[0] || 'น้องมาม่า';

let micState = '', micMsg = '';
__kit.mic = (state, msg) => {
  micState = state; micMsg = msg || '';
  if (state !== 'once') onceActive = false;
  if (state === 'error' || state === 'noperm') setStatus({ error: msg }); else setStatus();
};

/** ระบบฟังได้ยิน: texts = คำที่น่าจะเป็นหลายแบบ (แบบแรกมั่นใจสุด) */
__kit.hear = (json) => {
  const h = JSON.parse(json);
  const texts = (h.texts || []).filter(Boolean);
  if (!texts.length) return;
  if (h.partial) {
    if (!wokeThisRound && texts.some(t => L.findWake(t, wakeList()).woke)) { wokeThisRound = true; K.ding('wake'); }
    if (h.once || Date.now() < followUntil || wokeThisRound) $('heard').textContent = '… ' + texts[0];
    return;
  }
  const dinged = wokeThisRound; wokeThisRound = false;
  if (h.once) { onceActive = false; return command(texts[0]); }
  for (const t of texts) {
    const w = L.findWake(t, wakeList());
    if (w.woke) { if (!dinged) K.ding('wake'); return command(w.rest, t); }
  }
  if (Date.now() < followUntil) return command(texts[0]);
  // เสียงคนคุยกัน/จอครัวอ่านออเดอร์ (ไม่มีชื่อเรียก) → ไม่สนใจ
};

__kit.key = k => { if (k === 'ptt') talkNow(); };

function talkNow() {
  if (speaking) K.stopSpeak();
  onceActive = true;
  K.ding('wake');
  K.listenOnce();
  setStatus();
}

// ---------- ทำตามคำสั่ง ----------
async function command(text, heardRaw) {
  $('heard').textContent = '“' + (heardRaw || text || wakeName()) + '”';
  if (pending && Date.now() > pending.until) pending = null;
  // ใช้ออเดอร์ล่าสุดเสมอ (ครัวอาจกดบนจอไปแล้ว)
  await refresh();
  const r = L.interpret(text, orders, { now: Date.now(), awaitingConfirm: !!pending, screen: cfg.screen || '' });
  if (r.highlight) highlight = { orders: r.highlight.orders || [], dishes: r.highlight.dishes || [], until: Date.now() + 20000 };
  render();

  switch (r.kind) {
    case 'wake':
      followUntil = Date.now() + 8000; setStatus(); return;
    case 'yes': {
      const p = pending; pending = null;
      return p ? run(p) : speak('ไม่มีอะไรให้ยืนยันค่ะ');
    }
    case 'no': pending = null; followUntil = 0; return speak(r.say);
    case 'stop': pending = null; followUntil = 0; K.stopSpeak(); return;
    case 'repeat': return speak(lastSay || 'ยังไม่ได้พูดอะไรค่ะ');
    case 'undo': return undo();
    case 'done-dish': case 'done-table':
      if (cfg.confirm) { pending = { ...r, until: Date.now() + 30000 }; return speak(r.ask, 'ask'); }
      return run(r);
    case 'ask':
      followAfterSpeech = true; return speak(r.say, 'ask');
    default:
      return speak(r.say);
  }
}

async function post(path, body) {
  const r = await http('POST', base + path, body, 5000);
  if (r.code === 200) return true;
  let err = '';
  try { err = JSON.parse(r.text).error || ''; } catch {}
  throw new Error(r.code === 409 ? 'เครื่องนี้เป็นเครื่องสำรอง กดเสร็จไม่ได้' : err || 'ติดต่อเครื่อง ED POS ไม่ได้');
}

async function run(r) {
  try {
    for (const c of r.calls) await post(c.path, c.body);
    lastUndo = { calls: r.undo, label: r.say.replace(/^เรียบร้อย /, '').replace(/ เสร็จแล้วค่ะ$/, ''), at: Date.now() };
    K.ding('ok');
    speak(r.say);
  } catch (e) {
    K.ding('err');
    speak('ทำไม่สำเร็จค่ะ ' + e.message);
  }
  refresh();
}

async function undo() {
  if (!lastUndo || Date.now() - lastUndo.at > 15 * 60000) return speak('ไม่มีอะไรให้ย้อนกลับค่ะ');
  const u = lastUndo; lastUndo = null;
  try {
    for (const c of u.calls) await post(c.path, c.body);
    speak(`ย้อนกลับแล้วค่ะ ${u.label} กลับขึ้นจอแล้ว`);
  } catch (e) { speak('ย้อนกลับไม่สำเร็จค่ะ ' + e.message); }
  refresh();
}

// ---------- หน้าจอ ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lateMin = 15;

function render() {
  const up = Date.now() - lastOk < 10000;
  $('net').textContent = !cfg.main ? '' : up ? (base === cfg.standby ? 'เครื่องสำรอง' : '') : 'ต่อ ED POS ไม่ได้';
  $('net').className = 'net' + (up ? '' : ' down');
  const hlOn = Date.now() < highlight.until;
  const hlO = new Set(hlOn ? highlight.orders : []), hlD = new Set(hlOn ? highlight.dishes : []);
  const board = $('board');
  if (!cfg.main) { board.innerHTML = '<div class="empty">ยังไม่ได้ใส่ IP เครื่อง ED POS<br>แตะ ⚙ เพื่อตั้งค่า</div>'; return; }
  if (!lastOk) { board.innerHTML = '<div class="empty">กำลังติดต่อเครื่อง ED POS…</div>'; return; }
  if (!orders.length) { board.innerHTML = '<div class="empty">ไม่มีออเดอร์ค้าง 👌</div>'; return; }
  const now = Date.now();

  if (tab === 'groups') {
    board.innerHTML = L.groups(orders).map(g => {
      const hl = g.dishes.some(d => hlD.has(d.id)) || (!hlD.size && g.dishes.some(d => hlO.has(d.order.id)));
      const opts = [...g.opts].map(([k, n]) => `${esc(k)} ×${n}`).join(' · ');
      const chips = g.tables.map(t => {
        const o = g.dishes.find(d => L.tableLabel(d.order) === t).order;
        const m = L.mins(now, o.order_at);
        return `<span class="chip${m >= lateMin ? ' late' : ''}">${esc(t)} · ${m} น.</span>`;
      }).join('');
      return `<div class="grp${hl ? ' hl' : ''}"><div class="name">${esc(g.name)}${g.alerts ? ' <span class="alert">⚠</span>' : ''}</div>
        <div class="qty">${g.qty}</div>${opts ? `<div class="opts">${opts}</div>` : ''}<div class="chips">${chips}</div></div>`;
    }).join('');
  } else {
    board.innerHTML = orders.slice().sort((a, b) => a.order_at - b.order_at).map(o => {
      const m = L.mins(now, o.order_at);
      const items = (o.pending_dishes || []).map(d => {
        const opt = (d.extra_option || []).join(' ');
        return `<li${hlD.has(d.id) ? ' style="color:var(--hot)"' : ''}>${d.quantity || 1} × ${esc(d.name)}${opt ? ` <span class="opts">${esc(opt)}</span>` : ''}
          ${d.remark ? `<div class="rm${/⚠/.test(d.remark) ? ' alert' : ''}">${esc(d.remark)}</div>` : ''}</li>`;
      }).join('');
      return `<div class="ord${hlO.has(o.id) ? ' hl' : ''}"><h3>${esc(L.tableLabel(o))}<small class="${m >= lateMin ? 'late' : ''}">รอ ${m} นาที</small></h3><ul>${items}</ul></div>`;
    }).join('');
  }
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('talk').onclick = talkNow;
$('pause').onclick = () => { paused = !paused; K.setListening(!paused && cfg.mode === 'wake'); setStatus(); };

// ---------- ตั้งค่า ----------
$('gear').onclick = async () => {
  const a = base && await getJSON(base + '/api/auth', 2500);
  if (a && !a.setup) { $('pin').value = ''; $('pinMsg').textContent = ''; $('lock').classList.add('open'); setTimeout(() => $('pin').focus(), 50); }
  else openSetup();   // ต่อเครื่องไม่ได้/ยังไม่ตั้งรหัส → เข้าได้เลย (ไว้แก้ IP)
};
$('pinCancel').onclick = () => $('lock').classList.remove('open');
$('pinOk').onclick = () => {
  const r = K.checkAdminPin(base, $('pin').value);
  if (r === 'ok' || r === 'offline') { $('lock').classList.remove('open'); openSetup(); }
  else $('pinMsg').textContent = r.replace(/^bad:/, '');
};

let draftMode = 'wake';
function openSetup() {
  $('sMain').value = (cfg.main || '').replace(/^http:\/\//, '').replace(/:3000$/, '');
  $('sStandby').value = (cfg.standby || '').replace(/^http:\/\//, '').replace(/:3000$/, '');
  const opts = [...screens.map(s => [s.id, s.name]), ['all', 'ทุกจอรวมกัน']];
  if (!opts.length || !screens.length) opts.unshift(['', 'จอครัวหลัก (ค่าเริ่มต้น)']);
  $('sScreen').innerHTML = opts.map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join('');
  $('sScreen').value = cfg.screen || opts[0][0];
  draftMode = cfg.mode;
  segMode();
  $('sWake').value = cfg.wake;
  $('sConfirm').checked = cfg.confirm;
  $('sVolKey').checked = cfg.volKey;
  $('sMute').checked = cfg.mute;
  $('sRate').value = cfg.rate || 1; $('sRateV').textContent = (+$('sRate').value).toFixed(1);
  $('ver').textContent = 'ผู้ช่วยครัว รุ่น ' + cfg.version;
  ['sMainMsg', 'sStandbyMsg', 'ttsMsg'].forEach(i => $(i).textContent = '');
  const st = K.ttsStatus();
  if (st !== 'ok') $('ttsMsg').innerHTML = `<span class="bad">${st === 'nothai' ? 'ยังไม่มีเสียงอ่านภาษาไทย แตะ “ตั้งค่าเสียงอ่าน” → Google → ติดตั้งภาษาไทย' : 'ไม่พบเครื่องอ่านออกเสียง'}</span>`;
  $('setup').classList.add('open');
}
function segMode() { document.querySelectorAll('#sMode button').forEach(b => b.classList.toggle('on', b.dataset.v === draftMode)); }
document.querySelectorAll('#sMode button').forEach(b => b.onclick = () => { draftMode = b.dataset.v; segMode(); });
$('sRate').oninput = () => $('sRateV').textContent = (+$('sRate').value).toFixed(1);
document.querySelectorAll('[data-test]').forEach(b => b.onclick = () => {
  const f = b.dataset.test, msg = $(f + 'Msg');
  msg.className = 'msg'; msg.textContent = 'กำลังทดสอบ…';
  setTimeout(() => {
    const r = JSON.parse(K.testServer($(f).value));
    msg.className = 'msg ' + (r.ok ? 'good' : 'bad');
    msg.textContent = r.ok ? `✓ เจอ ${r.shop || 'ED POS'} (${r.role === 'standby' ? 'เครื่องสำรอง' : 'เครื่องหลัก'})` : '✗ ติดต่อไม่ได้ ตรวจ IP และ Wi-Fi';
  }, 30);
});
$('tTest').onclick = () => K.speak('สวัสดีค่ะ น้องมาม่าพร้อมช่วยงานครัวแล้วค่ะ', +$('sRate').value);
$('tTts').onclick = () => K.openTtsSettings();
$('sCancel').onclick = () => { $('setup').classList.remove('open'); if (!cfg.main) render(); };
$('sSave').onclick = () => {
  const wake = $('sWake').value.trim() || L.DEFAULT_WAKE.join(', ');
  K.saveConfig(JSON.stringify({
    main: $('sMain').value, standby: $('sStandby').value, screen: $('sScreen').value, mode: draftMode, wake,
    confirm: $('sConfirm').checked, volKey: $('sVolKey').checked, mute: $('sMute').checked, rate: +$('sRate').value,
  }));
  cfg = JSON.parse(K.getConfig());
  base = '';
  $('setup').classList.remove('open');
  start();
};

// ---------- เริ่ม ----------
function start() {
  if (!cfg.wake) cfg.wake = L.DEFAULT_WAKE.join(', ');
  K.setListening(cfg.mode === 'wake' && !paused && !!cfg.main);
  setStatus();
  render();
  if (cfg.main) refresh();
  else openSetup();
}
setInterval(() => { if (cfg.main && !document.querySelector('.sheet.open')) refresh(); }, 3000);
setInterval(render, 30000);   // นาทีที่รอ
start();
</script>
</body>
</html>
